# ATTENTION : Ne jamais committer ce fichier avec de vraies valeurs.
# Utiliser `kubectl create secret` ou un outil de gestion de secrets (Vault, Sealed Secrets).
# Les valeurs ci-dessous sont des placeholders encodés en base64.
# Encoder vos valeurs : echo -n "votre_valeur" | base64

apiVersion: v1
kind: Secret
metadata:
  name: greenops-db-secret
  namespace: greenops
  labels:
    app.kubernetes.io/name: greenops-platform
type: Opaque
data:
  # echo -n "greenops" | base64 → Z3JlZW5vcHM=
  POSTGRES_DB: Z3JlZW5vcHM=
  POSTGRES_USER: Z3JlZW5vcHM=
  # echo -n "greenops_secret_CHANGE_ME" | base64
  POSTGRES_PASSWORD: Z3JlZW5vcHNfc2VjcmV0X0NIQU5HRV9NRQ==

---
